[karyotype_dotplot]
# Same left/top convention and native formats as WGDI dotplot.
# Species 1 is displayed; species 2 provides within-chromosome dot x positions.
gff1 = species.gff
gff2 = ancestor.gff
lens1 = species.lens
lens2 = ancestor.lens
collinearity = species.ancestor.collinearity
ancestor_left = species.ancestor.txt
ancestor_top = ancestor.ancestor.txt
genome1_name = Extant species
genome2_name = Ancestral karyotype
position = order
width = 0.6
markersize = 0.5
markeralpha = 0.5
figsize = 14,6.18
fontsize = 10
block_length = 1
labels = true
legend = true
strict = true
savefig = species.ancestor.karyotype.svg
# title = Ancestral karyotype vs extant species
# dpi = 500
# ancestor_top is optional (set to none); ancestor_left must cover every order
# from 1 through lens1 gene_count, with no gaps or overlaps.
